{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Parlour - Admin</title>
    <link rel="stylesheet" href="{% static 'css/admin.css' %}" />
  </head>
  <body>
    <div class="admin-container">
      <h2>Add Parlour Details</h2>
      <form id="addParlourForm" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
          <label for="parlour_name">Name:</label>
          <input type="text" id="parlour_name" name="parlour_name" required />
        </div>

        <div class="form-group">
          <label for="description">Description:</label>
          <textarea
            id="description"
            name="description"
            rows="5"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="location">Location:</label>
          <input type="text" id="location" name="location" required />
        </div>

        <div class="form-group">
          <label for="rating">Rating (0–5):</label>
          <input
            type="number"
            step="0.1"
            max="5"
            min="0"
            id="rating"
            name="rating"
            required
          />
        </div>
        <label for="services">Select Services:</label>
<select id="services" name="services" multiple required>
  {% for service in services %}
    <option value="{{ service.id }}" {% if parlour and service in parlour.services.all %}selected{% endif %}>
      {{ service.name }}
    </option>
  {% endfor %}
</select>
<small>Use Ctrl (Windows) or Cmd (Mac) to select multiple</small>
        <div class="form-group">
          <label for="image">Image:</label>
          <input type="file" id="image" name="image" required />
        </div>

        <button type="submit">Add Parlour</button>
        <p id="alertMessage"></p>
      </form>
    </div>

    <script>
      document
        .getElementById("addParlourForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const form = e.target;
          const formData = new FormData(form);
          const alertBox = document.getElementById("alertMessage");

          fetch("{% url 'add_parlour' %}", {
            method: "POST",
            body: formData,
            headers: {
              "X-CSRFToken": form.querySelector("[name=csrfmiddlewaretoken]")
                .value,
            },
          })
            .then((res) => res.json())
            .then((data) => {
              alertBox.textContent = data.message;
              alertBox.style.color =
                data.status === "success" ? "green" : "red";

              if (data.status === "success") {
                form.reset();
              }
            })
            .catch(() => {
              alertBox.textContent = "Something went wrong. Please try again.";
              alertBox.style.color = "red";
            });
        });
    </script>
  </body>
</html>

{% extends 'service_app/base.html' %} {% load static %} {% block content %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}" />

<div class="profile-container">
  <h2>User Profile</h2>

  <div class="profile-card">
    <table>
      <tr>
        <th>Username:</th>
        <td>{{ user.username }}</td>
      </tr>
      <tr>
        <th>Email:</th>
        <td>{{ user.email }}</td>
      </tr>
      <tr>
        <th>First Name:</th>
        <td>{{ user.first_name }}</td>
      </tr>
      <tr>
        <th>Last Name:</th>
        <td>{{ user.last_name }}</td>
      </tr>
      <tr>
        <th>Date Joined:</th>
        <td>{{ user.date_joined|date:"F d, Y" }}</td>
      </tr>
    </table>
  </div>
</div>
{% endblock %}
